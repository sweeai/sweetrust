# Publishes `sweetrust` to npm when a `v*` tag is pushed, with npm provenance.
#
# Trusted publishing (OIDC): no npm token exists anywhere, not in this repo's
# secrets and not on a laptop. npmjs.com trusts exactly this workflow file in
# this repository (package settings → Trusted Publisher → GitHub Actions,
# repository sweeai/sweetrust, workflow release.yml). GitHub mints a short-lived
# identity token for this run; npm exchanges it for a one-time publish right and
# signs a provenance statement linking the tarball to the commit that built it.
#
# Actions are pinned to full commit SHAs, as in ci.yml.

name: release

on:
  push:
    tags: ["v*"]
  # Re-run a publish for an existing tag (for example, after the npm side was
  # configured). The workflow file on the default branch runs; it checks out the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.5.0"
        required: true

# id-token: write lets this run ask GitHub for the OIDC token npm verifies.
# Nothing here writes to the repository.
permissions:
  contents: read
  id-token: write

# Never two publishes at once, and never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, reads packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs Node ≥ 22.14 and npm ≥ 11.5.1.
          node-version: "24.x"
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: npm can do trusted publishing (≥ 11.5.1)
        run: |
          v=$(npm --version)
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number)
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)))
            if (!ok) { console.error(`npm ${process.argv[1]} < 11.5.1`); process.exit(1) }
            console.log(`npm ${process.argv[1]}`)' "$v"

      # A tag that disagrees with package.json would publish a version nobody tagged.
      - name: tag matches package.json
        run: |
          v=$(node -p 'require("./packages/trust/package.json").version')
          if [ "v$v" != "$TAG" ]; then
            echo "tag $TAG does not match package.json version v$v" >&2
            exit 1
          fi
          echo "publishing sweetrust@$v from $TAG"

      - run: pnpm install --frozen-lockfile

      # prepublishOnly re-runs build → test → typecheck before anything is uploaded.
      - name: publish
        working-directory: packages/trust
        run: npm publish --provenance --access public
