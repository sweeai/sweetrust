# The package's gates, on every push to main and every pull request: the same
# build → test → typecheck a contributor runs locally (packages/trust/AGENTS.md § Gates).
#
# Actions are pinned to full commit SHAs, never to tags. A tag can be moved to
# new code after review; a commit cannot. The comment beside each pin names
# the release it was taken from.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token. Nothing here writes to the repository, comments, or publishes.
permissions:
  contents: read

# A newer push to a pull request cancels its older run. On main every commit
# keeps its own run, so each one ends with a pass or a fail.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The typecheck gate and the demos run TypeScript directly and need Node ≥ 22.18.
          - node: "22.x"
            typecheck: true
          - node: "24.x"
            typecheck: true
          # The engines floor: the kernel's package.json promises consumers Node ≥ 20.19,
          # so this leg builds, tests and loads the kernel's dist/ on it. It skips the
          # typecheck gate, which is dev tooling. It filters to the kernel because
          # sweetrust-sui promises Node ≥ 22 (its peer @mysten/sui requires it); the
          # 22.x and 24.x legs cover the adapter.
          - node: "20.19"
            typecheck: false
            # A path, not the name: the private workspace root is also named "sweetrust".
            only: "--filter ./packages/trust"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, reads packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # The newest release in the range, not whatever the runner image cached.
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: the test suite and both typecheck gates read dist/.
      - run: pnpm ${{ matrix.only }} build
      - run: pnpm ${{ matrix.only }} test
      # The tests run src/ through vitest. This step loads what a consumer imports:
      # the built dist/, by package name, through the exports map.
      - name: load dist/ through the exports map
        working-directory: packages/trust
        run: |
          node --input-type=module -e '
            for (const entry of ["sweetrust", "sweetrust/mandate", "sweetrust/gate", "sweetrust/verify"]) {
              const m = await import(entry)
              if (Object.keys(m).length === 0) throw new Error(`${entry} exports nothing`)
              console.log(`${entry}: ${Object.keys(m).length} exports`)
            }'
      - if: matrix.typecheck
        run: pnpm typecheck
