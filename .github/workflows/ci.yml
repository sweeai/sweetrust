# The package's gates, on every push to main and every pull request: the same
# build → test → typecheck a contributor runs locally (packages/trust/AGENTS.md § Gates).
#
# Actions are pinned to full commit SHAs, never to tags. A tag can be moved to
# new code after review; a commit cannot. The comment beside each pin names
# the release it was taken from.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token. Nothing here writes to the repository, comments, or publishes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: build · test · typecheck (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The typecheck gate and the demos run TypeScript directly and need Node ≥ 22.18.
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, reads packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: the test suite and both typecheck gates read dist/.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck

  engines-floor:
    # The published dist/ promises Node ≥ 20.19 (package.json "engines"). This job
    # holds that promise: it builds and tests on the floor itself. It skips the
    # typecheck gate, which is dev tooling and needs Node 22.18.
    name: build · test on the engines floor (Node 20.19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, reads packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.19"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
