# Publishes `sweetrust-sui` to npm when a `sweetrust-sui@*` tag is pushed, with npm provenance.
#
# The twin of release.yml, which publishes the kernel on `v*` tags. A separate file, so the
# kernel's release path stays byte-for-byte what npmjs.com already trusts, and so the two tag
# namespaces can never publish the wrong package: `sweetrust-sui@0.1.0` does not match `v*`.
#
# Trusted publishing (OIDC): no npm token exists anywhere. npmjs.com trusts exactly this
# workflow file for sweetrust-sui (package settings → Trusted Publisher → GitHub Actions,
# repository sweeai/sweetrust, workflow release-sui.yml).
#
# STAGED, not published: this run puts the version on npm in a state nobody can install, and a
# maintainer approves it with 2FA (`npm stage approve`, or npmjs.com → Staged Packages). A
# compromised workflow or a stolen tag can stage, but only a person can release. npm's own
# advice for trust relationships: "only enable npm stage publish … and disable npm publish"
# (`npm help stage`, npm 11.19.1). The trusted publisher therefore has "Allow npm publish"
# unticked. RELEASING.md § Releasing `sweetrust-sui` has the steps.
#
# Actions are pinned to full commit SHAs, as in ci.yml.

name: release-sui

on:
  push:
    tags: ["sweetrust-sui@*"]
  # Re-run a stage for an existing tag. This file runs from whichever branch the dispatcher
  # picks (main by default), and it checks out refs/tags/<tag>, never a branch of that name.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. sweetrust-sui@0.1.0"
        required: true

# id-token: write lets this run ask GitHub for the OIDC token npm verifies.
# Nothing here writes to the repository.
permissions:
  contents: read
  id-token: write

# The same group as release.yml: never two publishes at once, of either package, and never
# cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fully qualified, so a branch named like the tag can never be checked out instead.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, reads packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Staged publishing needs Node ≥ 22.14 and npm ≥ 11.15.0 (docs.npmjs.com/staged-publishing).
          node-version: "24.x"
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          # No dependency cache on a release job: a tag run could restore a cache that another
          # run wrote, and what goes into the tarball must come from the lockfile alone.

      - name: npm can stage (≥ 11.15.0)
        run: |
          v=$(npm --version)
          node -e '
            const [a, b] = process.argv[1].split(".").map(Number)
            const ok = a > 11 || (a === 11 && b >= 15)
            if (!ok) { console.error(`npm ${process.argv[1]} < 11.15.0`); process.exit(1) }
            console.log(`npm ${process.argv[1]}`)' "$v"

      # A tag that disagrees with package.json would publish a version nobody tagged.
      - name: tag matches package.json
        run: |
          v=$(node -p 'require("./packages/sui/package.json").version')
          if [ "sweetrust-sui@$v" != "$TAG" ]; then
            echo "tag $TAG does not match package.json version sweetrust-sui@$v" >&2
            exit 1
          fi
          echo "publishing sweetrust-sui@$v from $TAG"

      - run: pnpm install --frozen-lockfile

      # The adapter's README gate compiles against the kernel's dist/, so build the kernel first.
      - run: pnpm --filter ./packages/trust build

      # prepublishOnly re-runs build → test → typecheck before anything is uploaded (stage runs
      # the same lifecycle; checked with --dry-run on npm 11.19.1). Nothing installable exists
      # until a maintainer approves the staged version.
      - name: stage for approval
        working-directory: packages/sui
        run: npm stage publish --provenance --access public
